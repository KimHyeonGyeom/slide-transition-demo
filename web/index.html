<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라이드 전환효과 테스트</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dde1e6; --text:#1f2933; --muted:#6b7280;
          --accent:#2563eb; --ok:#059669; --err:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.5;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  h2 small { font-weight:400; color:var(--muted); font-size:.85rem; margin-left:6px; }
  .lead, .muted { color: var(--muted); margin: 0 0 20px; }
  fieldset { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:16px; margin:0 0 16px; }
  legend { font-weight:600; padding:0 6px; }
  label { display:block; margin:10px 0 4px; font-weight:500; }
  small, .files { color: var(--muted); font-size:.9rem; }
  select, input[type=number] { font: inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  button { font: inherit; padding:10px 18px; border-radius:8px; border:1px solid var(--accent);
           background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .status { margin:12px 0; min-height:1.5em; font-weight:500; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .grid { display:grid; grid-template-columns: 320px 1fr; gap:16px; align-items:start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .list { list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:10px;
          background:var(--card); overflow:hidden; }
  .list li { display:flex; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  .list li:last-child { border-bottom:0; }
  .list li:hover { background:#f8fafc; }
  .list li.selected { background:#eef2ff; box-shadow: inset 3px 0 0 var(--accent); }
  .list img { width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; background:#000; flex:none; }
  .list .meta { flex:1; min-width:0; }
  .list .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list .sub { font-size:.85rem; color:var(--muted); }
  .badge { display:inline-block; font-size:.75rem; padding:1px 7px; border-radius:999px;
           background:#fef3c7; color:#92400e; margin-left:6px; }
  .badge.plain { background:#e5e7eb; color:#374151; }
  .panel { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:16px; }
  .note { background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:8px 12px; font-size:.9rem; margin:12px 0; }
  video { width:100%; background:#000; border-radius:10px; }
  video.small { max-width:560px; margin-top:8px; }
  .timeline { position:relative; height:56px; margin:16px 0 8px; border-radius:8px; overflow:hidden; background:#e5e7eb; }
  .seg { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
         font-size:.8rem; color:#fff; border-right:1px solid rgba(255,255,255,.6); overflow:hidden; white-space:nowrap; }
  .tr { position:absolute; top:0; bottom:0; display:flex; align-items:flex-end; justify-content:center;
        font-size:.7rem; color:#000; overflow:hidden;
        background:repeating-linear-gradient(45deg, rgba(250,204,21,.9) 0 6px, rgba(234,179,8,.9) 6px 12px); }
  pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:.85rem; }
  a.dl { display:inline-block; margin:8px 0 12px; }
</style>
</head>
<body>
<main>
  <h1>슬라이드 전환효과 테스트</h1>
  <p class="lead">왼쪽 목록에서 슬라이드를 고르고, 그 슬라이드로 들어올 때의 전환을 정합니다.
    전환은 앞 슬라이드의 마지막 구간에서 일어나 이 슬라이드의 시작 시각에 끝납니다. 전체 길이와 나레이션은 그대로입니다.</p>

  <fieldset>
    <legend>1. 입력</legend>
    <label for="clips">슬라이드 영상 (2개 이상, 파일 이름 순서로 이어짐)</label>
    <input id="clips" type="file" multiple accept="video/mp4,video/*">
    <div class="files" id="clipList"></div>
    <label for="images">슬라이드 이미지 (선택, 영상과 같은 개수)</label>
    <input id="images" type="file" multiple accept="image/*">
    <div class="files">이미지를 주면 영상의 첫/끝 프레임 복제 대신 이미지 2장으로 전환 구간을 만듭니다.</div>
    <div class="row" style="margin-top:12px">
      <button type="button" id="uploadBtn">프로젝트 만들기</button>
      <button type="button" class="secondary" id="sampleBtn">샘플 4장으로 시작</button>
    </div>
  </fieldset>
  <div class="status" id="status"></div>

  <section id="editor" hidden>
    <h2>2. 슬라이드별 전환 <small>위치는 "앞"으로 고정</small></h2>
    <div class="grid">
      <ul class="list" id="slideList"></ul>
      <div class="panel" id="panel"></div>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="row">
      <button type="button" id="renderBtn">3. 전체 렌더링</button>
      <span class="status" id="renderStatus"></span>
    </div>
    <section id="result" hidden>
      <video id="video" controls></video>
      <pre id="report"></pre>
      <a class="dl" id="download" download="result.mp4">결과 영상 다운로드</a>
      <details><summary>실행한 ffmpeg 명령</summary><pre id="cmd"></pre></details>
    </section>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sortByName = (files) => [...files].sort((a, b) => a.name.localeCompare(b.name));

let TRANSITIONS = { popular: [], all: [] };
let project = null;     // { id, slides: [{ index, name, duration, thumb, has_image }], max_duration, default_duration }
let selected = 1;
let transitions = {};   // { "2": { type, duration } }  슬라이드 번호 -> 들어올 때 전환

function setStatus(el, msg, cls = '') { el.textContent = msg; el.className = 'status ' + cls; }
function startAt(k) { let t = 0; for (let i = 0; i < k - 1; i++) t += project.slides[i].duration; return t; }

async function loadTransitions() {
  const res = await fetch('/api/transitions');
  TRANSITIONS = await res.json();
}

$('clips').addEventListener('change', () => {
  const names = sortByName($('clips').files).map((f, i) => `${i + 1}. ${f.name}`);
  $('clipList').textContent = names.join('   >   ');
});

// ---------------------------------------------------------------- 1. 프로젝트
async function createProject(useSample) {
  const fd = new FormData();
  fd.append('use_sample', useSample ? '1' : '0');
  if (!useSample) {
    const clips = sortByName($('clips').files);
    if (clips.length < 2) { setStatus($('status'), '슬라이드 영상을 2개 이상 선택해 주세요.', 'err'); return; }
    clips.forEach(f => fd.append('clips', f, f.name));
    sortByName($('images').files).forEach(f => fd.append('images', f, f.name));
  }
  setStatus($('status'), useSample ? '샘플 슬라이드를 만드는 중...' : '올리는 중...');
  $('uploadBtn').disabled = $('sampleBtn').disabled = true;
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.ok) { setStatus($('status'), '실패: ' + data.error, 'err'); return; }
    project = data.project; transitions = {}; selected = Math.min(2, project.slides.length);
    const total = project.slides.reduce((a, s) => a + s.duration, 0);
    setStatus($('status'), `슬라이드 ${project.slides.length}장, 총 ${total.toFixed(2)}초. 왼쪽 목록에서 슬라이드를 골라 전환을 정하세요.`, 'ok');
    $('editor').hidden = false; $('result').hidden = true; setStatus($('renderStatus'), '');
    renderList(); renderPanel(); drawTimeline();
    $('editor').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    setStatus($('status'), '요청 실패: ' + e, 'err');
  } finally {
    $('uploadBtn').disabled = $('sampleBtn').disabled = false;
  }
}

// ---------------------------------------------------------------- 2. 슬라이드 목록 / 패널
function renderList() {
  const ul = $('slideList'); ul.innerHTML = '';
  project.slides.forEach(s => {
    const li = document.createElement('li');
    li.className = s.index === selected ? 'selected' : '';
    const t = transitions[s.index];
    const badge = t ? `<span class="badge">${esc(t.type)} ${t.duration}s</span>`
                    : (s.index > 1 ? '<span class="badge plain">컷</span>' : '');
    li.innerHTML = `<img src="${s.thumb}" alt="">
      <div class="meta"><div class="name">${s.index}. ${esc(s.name)}</div>
      <div class="sub">${s.duration.toFixed(2)}s · 시작 ${startAt(s.index).toFixed(2)}s${badge}</div></div>`;
    li.addEventListener('click', () => { selected = s.index; renderList(); renderPanel(); });
    ul.appendChild(li);
  });
}

function fillTransitionSelect(sel, current) {
  sel.innerHTML = '';
  sel.appendChild(new Option('없음 (컷)', 'none'));
  const g1 = document.createElement('optgroup'); g1.label = '자주 쓰는 전환';
  TRANSITIONS.popular.forEach(n => g1.appendChild(new Option(n, n)));
  const g2 = document.createElement('optgroup'); g2.label = '전체';
  TRANSITIONS.all.filter(n => !TRANSITIONS.popular.includes(n)).forEach(n => g2.appendChild(new Option(n, n)));
  sel.append(g1, g2);
  sel.value = current;
}

function renderPanel() {
  const p = $('panel');
  const s = project.slides[selected - 1];
  if (selected === 1) {
    p.innerHTML = `<h2>1번 슬라이드 <small>${esc(s.name)} · ${s.duration.toFixed(2)}s</small></h2>
      <p class="muted">첫 슬라이드에는 들어오는 전환이 없습니다. 2번 슬라이드부터 골라 주세요.</p>`;
    return;
  }
  const t = transitions[selected] || { type: 'none', duration: project.default_duration };
  p.innerHTML = `
    <h2>${selected}번 슬라이드로 들어올 때 <small>${esc(s.name)} · ${s.duration.toFixed(2)}s</small></h2>
    <div class="row">
      <div><label for="ptype">전환 종류</label><select id="ptype"></select></div>
      <div><label for="pdur">길이 (초, 최대 ${project.max_duration})</label>
        <input id="pdur" type="number" min="0.1" max="${project.max_duration}" step="0.1" value="${t.duration}"></div>
    </div>
    <div class="note" id="pnote"></div>
    <div class="row">
      <button type="button" class="secondary" id="previewBtn">이 구간만 미리보기</button>
      <span class="status" id="previewStatus"></span>
    </div>
    <video id="preview" class="small" controls hidden></video>`;
  fillTransitionSelect($('ptype'), t.type);
  updateNote();
  $('ptype').addEventListener('change', saveTransition);
  $('pdur').addEventListener('change', saveTransition);
  $('previewBtn').addEventListener('click', preview);
}

function updateNote() {
  const prev = project.slides[selected - 2];
  const type = $('ptype').value, dur = Number($('pdur').value), at = startAt(selected).toFixed(2);
  $('pnote').innerHTML = type === 'none'
    ? `전환 없음. ${selected}번 슬라이드는 ${at}s 에 바로 바뀝니다 (컷).`
    : `위치는 <b>앞</b>으로 고정. ${selected - 1}번 슬라이드(${esc(prev.name)})의 마지막 <b>${dur}</b>초 동안
       <b>${esc(type)}</b> 전환이 일어나고, ${selected}번 슬라이드 시작 시각 <b>${at}s</b> 에 끝납니다.
       전체 길이와 나레이션은 그대로입니다.`;
}

function saveTransition() {
  const type = $('ptype').value;
  let dur = Number($('pdur').value) || project.default_duration;
  dur = Math.round(Math.min(project.max_duration, Math.max(0.1, dur)) * 10) / 10;
  $('pdur').value = dur;
  if (type === 'none') delete transitions[selected]; else transitions[selected] = { type, duration: dur };
  updateNote(); renderList(); drawTimeline();
}

async function preview() {
  const type = $('ptype').value;
  if (type === 'none') { setStatus($('previewStatus'), '전환 종류를 먼저 고르세요.', 'err'); return; }
  const body = { project: project.id, slide: selected, transition: type, duration: Number($('pdur').value) };
  $('previewBtn').disabled = true; setStatus($('previewStatus'), '미리보기 만드는 중...');
  try {
    const res = await fetch('/api/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify(body) });
    const data = await res.json();
    if (!data.ok) { setStatus($('previewStatus'), '실패: ' + data.error, 'err'); return; }
    const v = $('preview'); v.src = data.video; v.hidden = false; v.play().catch(() => {});
    setStatus($('previewStatus'), `미리보기 ${data.report.actual.toFixed(1)}초: 앞 슬라이드 끝 ${data.tail.toFixed(1)}초 + 이 슬라이드 앞 ${data.head.toFixed(1)}초`, 'ok');
  } catch (e) {
    setStatus($('previewStatus'), '요청 실패: ' + e, 'err');
  } finally {
    $('previewBtn').disabled = false;
  }
}

// ---------------------------------------------------------------- 3. 전체 렌더링
async function renderAll() {
  $('renderBtn').disabled = true; $('result').hidden = true;
  setStatus($('renderStatus'), '렌더링 중... 영상 길이에 따라 수십 초 걸릴 수 있습니다.');
  try {
    const res = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ project: project.id, transitions }) });
    const data = await res.json();
    if (!data.ok) { setStatus($('renderStatus'), '실패: ' + data.error, 'err'); return; }
    const r = data.report;
    setStatus($('renderStatus'), (r.ok ? 'OK 길이 유지. ' : '길이 불일치! ')
              + `입력 합계 ${r.expected.toFixed(3)}s / 출력 ${r.actual.toFixed(3)}s`, r.ok ? 'ok' : 'err');
    $('video').src = data.video; $('download').href = data.video;
    $('report').textContent = [...(data.warnings || []).map(w => '!! ' + w), ...r.lines].join('\n');
    $('cmd').textContent = data.command;
    $('result').hidden = false;
  } catch (e) {
    setStatus($('renderStatus'), '요청 실패: ' + e, 'err');
  } finally {
    $('renderBtn').disabled = false;
  }
}

function drawTimeline() {
  const tl = $('timeline'); tl.innerHTML = '';
  const total = project.slides.reduce((a, s) => a + s.duration, 0);
  const colors = ['#2563eb', '#ea580c', '#059669', '#7c3aed', '#db2777', '#0891b2'];
  project.slides.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'seg';
    d.style.left = (startAt(s.index) / total * 100) + '%'; d.style.width = (s.duration / total * 100) + '%';
    d.style.background = colors[i % colors.length];
    d.textContent = `${s.index}. ${s.duration.toFixed(2)}s`; d.title = `${s.name} ${s.duration.toFixed(2)}s`;
    tl.appendChild(d);
  });
  Object.entries(transitions).forEach(([k, t]) => {
    const end = startAt(Number(k)), start = end - t.duration;
    const d = document.createElement('div'); d.className = 'tr';
    d.style.left = (start / total * 100) + '%'; d.style.width = (t.duration / total * 100) + '%';
    d.textContent = t.type; d.title = `${t.type} ${start.toFixed(2)}~${end.toFixed(2)}s`;
    tl.appendChild(d);
  });
}

$('uploadBtn').addEventListener('click', () => createProject(false));
$('sampleBtn').addEventListener('click', () => createProject(true));
$('renderBtn').addEventListener('click', renderAll);
loadTransitions();
</script>
</body>
</html>
